<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Header Dropdown functionality
            const modifyBtn = document.getElementById('modify-btn');
            const contactMenu = document.getElementById('contact-menu');
            
            if (modifyBtn && contactMenu) {
                modifyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contactMenu.classList.toggle('hidden');
                });

                document.addEventListener('click', (e) => {
                    if (contactMenu && !contactMenu.contains(e.target) && e.target !== modifyBtn) {
                        contactMenu.classList.add('hidden');
                    }
                });
            }

            // Contact Modal functionality
            const contactNavBtn = document.getElementById('contact-nav-button');
            const contactModal = document.getElementById('contact-modal');
            const closeModal = document.getElementById('close-modal');

            const openModal = () => {
                contactModal.classList.remove('opacity-0', 'pointer-events-none');
            };

            const hideModal = () => {
                contactModal.classList.add('opacity-0', 'pointer-events-none');
            };

            if (contactNavBtn) {
                contactNavBtn.addEventListener('click', openModal);
            }

            if (closeModal) {
                closeModal.addEventListener('click', hideModal);
            }

            contactModal.addEventListener('click', (e) => {
                if (e.target === contactModal) {
                    hideModal();
                }
            });
        });
    </script>
